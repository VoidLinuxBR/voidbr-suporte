# /etc/voidbr-suporte.conf

# modo padrão: tailscale ou upterm
modo="tailscale"

# 1 = técnico e usuário compartilham o mesmo terminal (tmux, estilo tmate)
# 0 = técnico abre um terminal próprio
compartilhar=1
tmux_sessao="suporte"

# 1 = abre o terminal compartilhado direto, sem pedir Enter
# 0 = mostra o nome da máquina e espera Enter
auto=1

# ---- tailscale ----------------------------------------------------------
# segredo de um OAuth client (escopo auth_keys, tag abaixo) com parâmetros.
# ATENÇÃO: vai junto com o pacote/ISO; isole a tag nas regras de acesso.
ts_authkey="tskey-client-kH1322HMtJ11CNTRL-tDmy9AFgybdzt5MCbo5ybd9HnBKwNru7D?ephemeral=true&preauthorized=true"
ts_tag="tag:suporte"

# ---- upterm -------------------------------------------------------------
tecnicos_github="vcatafesta"
tecnicos_chaves=/etc/voidbr-suporte/authorized_keys
servidor="ssh://uptermd.upterm.dev:22"
# 1 = usuário aprova cada conexão; 0 = técnico autorizado entra direto
perguntar=0

# ---- aviso ao técnico (ntfy.sh; vazio = desliga) ------------------------
ntfy_topico=""
ntfy_url="https://ntfy.sh"







